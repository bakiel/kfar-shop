<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    font-family: 'DM Sans', sans-serif;
    background: #0a1f0a;
  }

  /* Radial glow */
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(196,162,101,0.12) 0%, rgba(45,90,39,0.08) 40%, transparent 70%);
    border-radius: 50%;
  }

  /* Subtle grid texture */
  .texture {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(196,162,101,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(196,162,101,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Top accent bar */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, #C4A265, transparent);
  }

  /* Gold decorative line */
  .gold-line {
    width: 120px;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, #C4A265, transparent);
    margin: 0 auto;
  }

  .gold-line-wide {
    width: 280px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(196,162,101,0.6), transparent);
    margin: 0 auto;
  }

  /* Logo area */
  .logo-area {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }

  .logo-area img {
    width: 200px;
    height: auto;
    filter: drop-shadow(0 0 40px rgba(196,162,101,0.3));
  }

  /* Main content */
  .content {
    position: absolute;
    top: 380px;
    left: 0; right: 0;
    text-align: center;
    padding: 0 80px;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 72px;
    line-height: 1.05;
    color: #F5F0E8;
    letter-spacing: -1px;
    margin-bottom: 32px;
    text-shadow: 0 2px 40px rgba(0,0,0,0.5);
  }

  .headline span {
    color: #C4A265;
  }

  .subtext {
    font-family: 'DM Sans', sans-serif;
    font-size: 24px;
    font-weight: 400;
    color: rgba(245,240,232,0.6);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 24px;
  }

  /* Bottom section */
  .bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 220px;
    padding: 0 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .bottom-left {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .url {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #C4A265;
    letter-spacing: 1px;
  }

  .tagline-bottom {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: rgba(245,240,232,0.4);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* QR section */
  .qr-section {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .qr-section img {
    width: 100px;
    height: 100px;
    border-radius: 12px;
    border: 2px solid rgba(196,162,101,0.3);
    padding: 6px;
    background: rgba(255,255,255,0.95);
  }

  .qr-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: rgba(245,240,232,0.5);
    text-transform: uppercase;
    letter-spacing: 2px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }

  /* Bottom gold line */
  .bottom-line {
    position: absolute;
    bottom: 200px;
    left: 60px;
    right: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(196,162,101,0.3), transparent);
  }

  /* Corner accents */
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border-color: rgba(196,162,101,0.25);
    border-style: solid;
  }
  .corner-tl { top: 40px; left: 40px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 40px; right: 40px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 40px; left: 40px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 40px; right: 40px; border-width: 0 2px 2px 0; }

  /* Floating dots */
  .dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(196,162,101,0.3);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="texture"></div>
  <div class="top-bar"></div>

  <!-- Corner accents -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Floating dots -->
  <div class="dot" style="top: 180px; left: 120px;"></div>
  <div class="dot" style="top: 300px; right: 150px;"></div>
  <div class="dot" style="bottom: 350px; left: 200px;"></div>
  <div class="dot" style="top: 500px; right: 100px;"></div>

  <!-- Logo -->
  <div class="logo-area">
    <img src="assets/logo-africa.png" alt="KFAR">
  </div>

  <!-- Main Content -->
  <div class="content">
    <div class="gold-line" style="margin-bottom: 28px;"></div>
    <h1 class="headline">
      The Whole Village,<br>
      <span>In Your Hand</span>
    </h1>
    <div class="gold-line" style="margin-top: 0;"></div>
    <p class="subtext">Multi-vendor marketplace<br>for the Village of Peace</p>
  </div>

  <!-- Bottom line -->
  <div class="bottom-line"></div>

  <!-- Bottom section -->
  <div class="bottom">
    <div class="bottom-left">
      <div class="url">kfarapp.com</div>
      <div class="tagline-bottom">Village of Peace, Dimona</div>
    </div>
    <div class="qr-section">
      <div class="qr-label">SCAN TO SHOP</div>
      <img src="assets/qr-kfar.png" alt="QR Code">
    </div>
  </div>
</body>
</html>
