<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Neon City</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* ===== CRT SCAN LINES ===== */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.08) 2px,
      rgba(0, 0, 0, 0.08) 4px
    );
  }

  .scanlines::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(0, 255, 255, 0.03) 50%,
      transparent 100%
    );
    height: 120px;
    animation: scanMove 3s linear infinite;
  }

  @keyframes scanMove {
    0% { transform: translateY(-120px); }
    100% { transform: translateY(100vh); }
  }

  /* ===== RAIN EFFECT ===== */
  .rain {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  .raindrop {
    position: absolute;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(0, 255, 255, 0.4), transparent);
    animation: rainFall linear infinite;
    opacity: 0.4;
  }

  @keyframes rainFall {
    0% { transform: translateY(-100vh); }
    100% { transform: translateY(100vh); }
  }

  /* Generate 30 raindrops */
  .raindrop:nth-child(1) { left: 3%; height: 80px; animation-duration: 1.2s; animation-delay: 0s; }
  .raindrop:nth-child(2) { left: 8%; height: 120px; animation-duration: 1.0s; animation-delay: 0.3s; }
  .raindrop:nth-child(3) { left: 13%; height: 90px; animation-duration: 1.4s; animation-delay: 0.1s; }
  .raindrop:nth-child(4) { left: 18%; height: 110px; animation-duration: 0.9s; animation-delay: 0.5s; }
  .raindrop:nth-child(5) { left: 23%; height: 70px; animation-duration: 1.3s; animation-delay: 0.2s; }
  .raindrop:nth-child(6) { left: 28%; height: 100px; animation-duration: 1.1s; animation-delay: 0.4s; }
  .raindrop:nth-child(7) { left: 33%; height: 85px; animation-duration: 1.0s; animation-delay: 0.6s; }
  .raindrop:nth-child(8) { left: 38%; height: 130px; animation-duration: 0.8s; animation-delay: 0.15s; }
  .raindrop:nth-child(9) { left: 43%; height: 95px; animation-duration: 1.2s; animation-delay: 0.35s; }
  .raindrop:nth-child(10) { left: 48%; height: 75px; animation-duration: 1.5s; animation-delay: 0.55s; }
  .raindrop:nth-child(11) { left: 53%; height: 115px; animation-duration: 0.95s; animation-delay: 0.25s; }
  .raindrop:nth-child(12) { left: 58%; height: 88px; animation-duration: 1.15s; animation-delay: 0.45s; }
  .raindrop:nth-child(13) { left: 63%; height: 105px; animation-duration: 1.05s; animation-delay: 0.65s; }
  .raindrop:nth-child(14) { left: 68%; height: 78px; animation-duration: 1.35s; animation-delay: 0.1s; }
  .raindrop:nth-child(15) { left: 73%; height: 125px; animation-duration: 0.85s; animation-delay: 0.4s; }
  .raindrop:nth-child(16) { left: 78%; height: 92px; animation-duration: 1.25s; animation-delay: 0.2s; }
  .raindrop:nth-child(17) { left: 83%; height: 108px; animation-duration: 1.0s; animation-delay: 0.5s; }
  .raindrop:nth-child(18) { left: 88%; height: 82px; animation-duration: 1.4s; animation-delay: 0.3s; }
  .raindrop:nth-child(19) { left: 93%; height: 118px; animation-duration: 0.9s; animation-delay: 0.7s; }
  .raindrop:nth-child(20) { left: 97%; height: 96px; animation-duration: 1.1s; animation-delay: 0.15s; }
  .raindrop:nth-child(21) { left: 5%; height: 140px; animation-duration: 0.75s; animation-delay: 0.45s; }
  .raindrop:nth-child(22) { left: 15%; height: 65px; animation-duration: 1.6s; animation-delay: 0.35s; }
  .raindrop:nth-child(23) { left: 25%; height: 110px; animation-duration: 0.95s; animation-delay: 0.55s; }
  .raindrop:nth-child(24) { left: 35%; height: 88px; animation-duration: 1.2s; animation-delay: 0.25s; }
  .raindrop:nth-child(25) { left: 45%; height: 102px; animation-duration: 1.05s; animation-delay: 0.6s; }

  /* ===== NEON CITY SKYLINE ===== */
  .city-skyline {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 280px;
    z-index: 1;
    pointer-events: none;
  }

  .building {
    position: absolute;
    bottom: 0;
    background: #0d0d15;
    border-top: 2px solid;
  }

  .building::before {
    content: '';
    position: absolute;
    inset: 4px;
    background: repeating-linear-gradient(
      0deg,
      transparent, transparent 8px,
      rgba(255, 255, 255, 0.03) 8px, rgba(255, 255, 255, 0.03) 10px
    ),
    repeating-linear-gradient(
      90deg,
      transparent, transparent 12px,
      rgba(255, 255, 255, 0.02) 12px, rgba(255, 255, 255, 0.02) 14px
    );
  }

  /* Windows that flicker */
  .building::after {
    content: '';
    position: absolute;
    width: 4px;
    height: 6px;
    background: rgba(255, 200, 50, 0.6);
    animation: windowFlicker 4s ease-in-out infinite;
  }

  .building:nth-child(1) { left: 2%; width: 60px; height: 180px; border-color: rgba(255, 0, 128, 0.5); }
  .building:nth-child(1)::after { top: 20px; left: 15px; animation-delay: 0s; }
  .building:nth-child(2) { left: 8%; width: 45px; height: 220px; border-color: rgba(0, 255, 255, 0.5); }
  .building:nth-child(2)::after { top: 40px; left: 20px; animation-delay: 1s; }
  .building:nth-child(3) { left: 14%; width: 70px; height: 260px; border-color: rgba(128, 0, 255, 0.5); }
  .building:nth-child(3)::after { top: 15px; left: 30px; animation-delay: 2s; }
  .building:nth-child(4) { left: 22%; width: 50px; height: 150px; border-color: rgba(255, 0, 128, 0.4); }
  .building:nth-child(4)::after { top: 30px; left: 10px; animation-delay: 0.5s; }
  .building:nth-child(5) { left: 30%; width: 80px; height: 200px; border-color: rgba(0, 255, 128, 0.5); }
  .building:nth-child(5)::after { top: 25px; left: 40px; animation-delay: 1.5s; }
  .building:nth-child(6) { left: 40%; width: 55px; height: 240px; border-color: rgba(0, 255, 255, 0.5); }
  .building:nth-child(7) { left: 48%; width: 65px; height: 170px; border-color: rgba(255, 100, 0, 0.5); }
  .building:nth-child(8) { left: 56%; width: 90px; height: 280px; border-color: rgba(255, 0, 255, 0.6); }
  .building:nth-child(9) { left: 66%; width: 40px; height: 190px; border-color: rgba(0, 200, 255, 0.5); }
  .building:nth-child(10) { left: 72%; width: 75px; height: 230px; border-color: rgba(255, 0, 128, 0.5); }
  .building:nth-child(11) { left: 80%; width: 50px; height: 160px; border-color: rgba(0, 255, 200, 0.4); }
  .building:nth-child(12) { left: 87%; width: 85px; height: 210px; border-color: rgba(128, 0, 255, 0.5); }
  .building:nth-child(13) { left: 95%; width: 60px; height: 250px; border-color: rgba(255, 50, 100, 0.5); }

  @keyframes windowFlicker {
    0%, 90%, 100% { opacity: 1; }
    92% { opacity: 0; }
    94% { opacity: 1; }
    96% { opacity: 0.3; }
  }

  /* ===== NEON GLOW SIGNS ===== */
  .neon-sign {
    position: absolute;
    z-index: 3;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    animation: neonFlicker 3s ease-in-out infinite;
  }

  .neon-sign.cyan {
    color: #0ff;
    text-shadow:
      0 0 7px #0ff,
      0 0 10px #0ff,
      0 0 21px #0ff,
      0 0 42px #0ff,
      0 0 82px #0ff;
  }

  .neon-sign.pink {
    color: #ff0080;
    text-shadow:
      0 0 7px #ff0080,
      0 0 10px #ff0080,
      0 0 21px #ff0080,
      0 0 42px #ff0080,
      0 0 82px #ff0080;
  }

  .neon-sign.purple {
    color: #bf00ff;
    text-shadow:
      0 0 7px #bf00ff,
      0 0 10px #bf00ff,
      0 0 21px #bf00ff,
      0 0 42px #bf00ff;
  }

  @keyframes neonFlicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
      opacity: 1;
      text-shadow:
        0 0 7px currentColor,
        0 0 10px currentColor,
        0 0 21px currentColor,
        0 0 42px currentColor,
        0 0 82px currentColor;
    }
    20%, 24%, 55% {
      opacity: 0.4;
      text-shadow: none;
    }
  }

  .neon-sign:nth-child(1) { top: 35%; left: 5%; font-size: 14px; animation-delay: 0s; }
  .neon-sign:nth-child(2) { top: 25%; right: 8%; font-size: 11px; animation-delay: 1s; }
  .neon-sign:nth-child(3) { top: 55%; left: 75%; font-size: 16px; animation-delay: 2s; }
  .neon-sign:nth-child(4) { top: 45%; left: 12%; font-size: 10px; animation-delay: 0.5s; }

  /* ===== GLITCH TEXT EFFECT ===== */
  .hero-content {
    position: relative;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 40px;
  }

  .glitch-container {
    position: relative;
    display: inline-block;
  }

  .glitch {
    font-family: 'Orbitron', sans-serif;
    font-size: 96px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #fff;
    position: relative;
    text-transform: uppercase;
  }

  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .glitch::before {
    color: #0ff;
    z-index: -1;
    animation: glitch1 2s infinite linear alternate-reverse;
  }

  .glitch::after {
    color: #ff0080;
    z-index: -2;
    animation: glitch2 3s infinite linear alternate-reverse;
  }

  @keyframes glitch1 {
    0% { clip-path: inset(40% 0 61% 0); transform: translate(-4px, 2px); }
    10% { clip-path: inset(92% 0 1% 0); transform: translate(4px, -1px); }
    20% { clip-path: inset(43% 0 1% 0); transform: translate(-2px, 3px); }
    30% { clip-path: inset(25% 0 58% 0); transform: translate(3px, -2px); }
    40% { clip-path: inset(54% 0 7% 0); transform: translate(-3px, 1px); }
    50% { clip-path: inset(58% 0 43% 0); transform: translate(2px, -3px); }
    60% { clip-path: inset(28% 0 42% 0); transform: translate(-4px, 2px); }
    70% { clip-path: inset(74% 0 22% 0); transform: translate(4px, -1px); }
    80% { clip-path: inset(13% 0 69% 0); transform: translate(-2px, 3px); }
    90% { clip-path: inset(85% 0 7% 0); transform: translate(3px, -2px); }
    100% { clip-path: inset(51% 0 31% 0); transform: translate(-3px, 1px); }
  }

  @keyframes glitch2 {
    0% { clip-path: inset(65% 0 13% 0); transform: translate(4px, -2px); }
    10% { clip-path: inset(15% 0 62% 0); transform: translate(-3px, 1px); }
    20% { clip-path: inset(79% 0 15% 0); transform: translate(2px, -3px); }
    30% { clip-path: inset(38% 0 41% 0); transform: translate(-4px, 2px); }
    40% { clip-path: inset(72% 0 8% 0); transform: translate(3px, -1px); }
    50% { clip-path: inset(18% 0 55% 0); transform: translate(-2px, 3px); }
    60% { clip-path: inset(89% 0 3% 0); transform: translate(4px, -2px); }
    70% { clip-path: inset(34% 0 48% 0); transform: translate(-3px, 1px); }
    80% { clip-path: inset(56% 0 21% 0); transform: translate(2px, -3px); }
    90% { clip-path: inset(8% 0 71% 0); transform: translate(-4px, 2px); }
    100% { clip-path: inset(42% 0 37% 0); transform: translate(3px, -1px); }
  }

  /* ===== NEON UNDERLINE ===== */
  .neon-line {
    width: 0;
    height: 3px;
    margin: 24px auto;
    background: linear-gradient(90deg, #ff0080, #0ff, #bf00ff, #0ff, #ff0080);
    background-size: 300% 100%;
    animation: lineExpand 1.5s ease-out 0.5s forwards, lineShimmer 2s linear 2s infinite;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), 0 0 40px rgba(255, 0, 128, 0.3);
  }

  @keyframes lineExpand {
    to { width: 500px; }
  }

  @keyframes lineShimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* ===== SUBTITLE ===== */
  .subtitle {
    font-size: 18px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(0, 255, 255, 0.6);
    margin-top: 12px;
    animation: subtitleReveal 1s ease-out 1s both;
  }

  @keyframes subtitleReveal {
    from { opacity: 0; letter-spacing: 20px; }
    to { opacity: 1; letter-spacing: 6px; }
  }

  /* ===== HUD PANELS ===== */
  .hud-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-top: 60px;
    max-width: 900px;
    width: 100%;
  }

  .hud-panel {
    position: relative;
    background: rgba(0, 255, 255, 0.03);
    border: 1px solid rgba(0, 255, 255, 0.15);
    border-radius: 4px;
    padding: 24px 16px;
    text-align: left;
    overflow: hidden;
    animation: hudSlideIn 0.6s ease-out both;
  }

  .hud-panel:nth-child(1) { animation-delay: 1.5s; }
  .hud-panel:nth-child(2) { animation-delay: 1.7s; }
  .hud-panel:nth-child(3) { animation-delay: 1.9s; }
  .hud-panel:nth-child(4) { animation-delay: 2.1s; }

  @keyframes hudSlideIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Corner brackets */
  .hud-panel::before,
  .hud-panel::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: rgba(0, 255, 255, 0.6);
    border-style: solid;
  }

  .hud-panel::before {
    top: -1px;
    left: -1px;
    border-width: 2px 0 0 2px;
  }

  .hud-panel::after {
    bottom: -1px;
    right: -1px;
    border-width: 0 2px 2px 0;
  }

  /* Scan line on panel */
  .hud-scan {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.6), transparent);
    animation: panelScan 2.5s ease-in-out infinite;
  }

  @keyframes panelScan {
    0%, 100% { top: 0; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  .hud-panel:nth-child(2) .hud-scan { animation-delay: 0.6s; }
  .hud-panel:nth-child(3) .hud-scan { animation-delay: 1.2s; }
  .hud-panel:nth-child(4) .hud-scan { animation-delay: 1.8s; }

  .hud-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(0, 255, 255, 0.5);
    margin-bottom: 8px;
  }

  .hud-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #0ff;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    animation: valueCount 2s ease-out 2.5s both;
  }

  .hud-panel:nth-child(1) .hud-value { color: #ff0080; text-shadow: 0 0 10px rgba(255, 0, 128, 0.5); }
  .hud-panel:nth-child(3) .hud-value { color: #bf00ff; text-shadow: 0 0 10px rgba(191, 0, 255, 0.5); }
  .hud-panel:nth-child(4) .hud-value { color: #00ff80; text-shadow: 0 0 10px rgba(0, 255, 128, 0.5); }

  @keyframes valueCount {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hud-bar {
    margin-top: 12px;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .hud-bar-fill {
    height: 100%;
    border-radius: 2px;
    animation: barFill 2s ease-out 2.8s both;
  }

  @keyframes barFill {
    from { width: 0; }
  }

  .hud-panel:nth-child(1) .hud-bar-fill { width: 78%; background: #ff0080; box-shadow: 0 0 8px #ff0080; }
  .hud-panel:nth-child(2) .hud-bar-fill { width: 92%; background: #0ff; box-shadow: 0 0 8px #0ff; }
  .hud-panel:nth-child(3) .hud-bar-fill { width: 65%; background: #bf00ff; box-shadow: 0 0 8px #bf00ff; }
  .hud-panel:nth-child(4) .hud-bar-fill { width: 88%; background: #00ff80; box-shadow: 0 0 8px #00ff80; }

  /* ===== FLOATING GRID FLOOR ===== */
  .grid-floor {
    position: fixed;
    bottom: 0;
    left: -10%;
    width: 120%;
    height: 40%;
    z-index: 0;
    background:
      linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 50px 50px;
    transform: perspective(500px) rotateX(60deg);
    transform-origin: bottom center;
    mask-image: linear-gradient(to top, black 0%, transparent 80%);
    -webkit-mask-image: linear-gradient(to top, black 0%, transparent 80%);
    animation: gridScroll 3s linear infinite;
  }

  @keyframes gridScroll {
    0% { background-position: 0 0; }
    100% { background-position: 0 50px; }
  }

  /* ===== FLOATING PARTICLES ===== */
  .particle {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    z-index: 5;
    pointer-events: none;
    animation: particleDrift linear infinite;
  }

  @keyframes particleDrift {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) translateX(var(--drift)); opacity: 0; }
  }

  .particle:nth-child(1) { left: 10%; background: #0ff; animation-duration: 6s; --drift: 30px; }
  .particle:nth-child(2) { left: 20%; background: #ff0080; animation-duration: 8s; animation-delay: 1s; --drift: -20px; }
  .particle:nth-child(3) { left: 35%; background: #bf00ff; animation-duration: 7s; animation-delay: 2s; --drift: 40px; }
  .particle:nth-child(4) { left: 50%; background: #0ff; animation-duration: 5s; animation-delay: 0.5s; --drift: -30px; }
  .particle:nth-child(5) { left: 65%; background: #ff0080; animation-duration: 9s; animation-delay: 3s; --drift: 20px; }
  .particle:nth-child(6) { left: 80%; background: #00ff80; animation-duration: 6.5s; animation-delay: 1.5s; --drift: -40px; }
  .particle:nth-child(7) { left: 90%; background: #bf00ff; animation-duration: 7.5s; animation-delay: 2.5s; --drift: 35px; }
  .particle:nth-child(8) { left: 45%; background: #0ff; animation-duration: 5.5s; animation-delay: 0.8s; --drift: -25px; }

  /* ===== STATUS BADGE ===== */
  .status-badge {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(0, 255, 255, 0.2);
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(0, 255, 255, 0.7);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0ff;
    box-shadow: 0 0 6px #0ff;
    animation: statusPulse 1.5s ease-in-out infinite;
  }

  @keyframes statusPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
  }

  /* ===== DEMO LABEL ===== */
  .demo-label {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(0, 255, 255, 0.2);
    border-radius: 4px;
    padding: 8px 20px;
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(0, 255, 255, 0.5);
    z-index: 100;
  }
</style>
</head>
<body>

<div class="scanlines"></div>

<!-- Rain -->
<div class="rain">
  <div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div>
  <div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div>
  <div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div>
  <div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div>
  <div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div>
  <div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div>
