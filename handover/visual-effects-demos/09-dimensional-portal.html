<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dimensional Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== DEEP SPACE BACKGROUND ===== */
  .space-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse at center,
      #0a0020 0%,
      #050010 40%,
      #000 100%
    );
  }

  /* ===== STAR FIELD - 3 LAYERS PARALLAX ===== */
  .star-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .star-layer.far {
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 45% 35%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 5% 55%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 65% 25%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 35% 75%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 95% 5%, rgba(255,255,255,0.6), transparent);
    animation: starTwinkle 4s ease-in-out infinite alternate;
  }

  .star-layer.mid {
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(200,220,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(200,220,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, rgba(200,220,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 40% 50%, rgba(200,220,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 10% 80%, rgba(200,220,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 70% 40%, rgba(200,220,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 50% 90%, rgba(200,220,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(200,220,255,0.7), transparent);
    animation: starTwinkle 5s ease-in-out 1s infinite alternate;
  }

  @keyframes starTwinkle {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* ===== PORTAL RINGS ===== */
  .portal-zone {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .portal-rings {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
  }

  .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    border: 2px solid;
    transform-origin: center center;
    animation: ringRotate linear infinite;
  }

  .ring:nth-child(1) {
    width: 600px; height: 600px;
    margin-top: -300px; margin-left: -300px;
    border-color: rgba(100, 100, 255, 0.15);
    animation-duration: 20s;
    animation-direction: normal;
  }

  .ring:nth-child(2) {
    width: 520px; height: 520px;
    margin-top: -260px; margin-left: -260px;
    border-color: rgba(150, 50, 255, 0.2);
    animation-duration: 15s;
    animation-direction: reverse;
    border-style: dashed;
  }

  .ring:nth-child(3) {
    width: 440px; height: 440px;
    margin-top: -220px; margin-left: -220px;
    border-color: rgba(200, 100, 255, 0.25);
    animation-duration: 12s;
    border-width: 1px;
  }

  .ring:nth-child(4) {
    width: 360px; height: 360px;
    margin-top: -180px; margin-left: -180px;
    border-color: rgba(255, 100, 200, 0.2);
    animation-duration: 10s;
    animation-direction: reverse;
    border-style: dotted;
    border-width: 3px;
  }

  .ring:nth-child(5) {
    width: 280px; height: 280px;
    margin-top: -140px; margin-left: -140px;
    border-color: rgba(100, 200, 255, 0.3);
    animation-duration: 8s;
  }

  .ring:nth-child(6) {
    width: 200px; height: 200px;
    margin-top: -100px; margin-left: -100px;
    border-color: rgba(0, 255, 200, 0.25);
    animation-duration: 6s;
    animation-direction: reverse;
    border-width: 1.5px;
  }

  .ring:nth-child(7) {
    width: 120px; height: 120px;
    margin-top: -60px; margin-left: -60px;
    border-color: rgba(255, 200, 100, 0.4);
    animation-duration: 4s;
    border-style: dashed;
  }

  @keyframes ringRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Ring glow nodes */
  .ring-node {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px currentColor, 0 0 16px currentColor;
  }

  .ring:nth-child(1) .ring-node { top: -3px; left: 50%; color: #6464ff; }
  .ring:nth-child(1) .ring-node:nth-child(2) { top: auto; bottom: -3px; }
  .ring:nth-child(3) .ring-node { top: 50%; right: -3px; color: #c864ff; }
  .ring:nth-child(5) .ring-node { bottom: -3px; left: 50%; color: #64c8ff; }
  .ring:nth-child(7) .ring-node { top: -3px; left: 50%; color: #ffc864; }

  /* ===== PORTAL CENTER CORE ===== */
  .portal-core {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80px;
    height: 80px;
    margin-top: -40px;
    margin-left: -40px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 255, 255, 0.9) 0%,
      rgba(200, 150, 255, 0.6) 30%,
      rgba(100, 50, 255, 0.3) 60%,
      transparent 100%
    );
    animation: corePulse 2s ease-in-out infinite;
    z-index: 5;
  }

  .portal-core::after {
    content: '';
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(150, 100, 255, 0.15) 0%,
      transparent 70%
    );
    animation: coreGlow 3s ease-in-out infinite;
  }

  @keyframes corePulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(150, 100, 255, 0.5); }
    50% { transform: scale(1.3); box-shadow: 0 0 80px rgba(150, 100, 255, 0.8), 0 0 120px rgba(100, 50, 255, 0.4); }
  }

  @keyframes coreGlow {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.5; }
  }

  /* ===== ENERGY STREAMS ===== */
  .energy-stream {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 300px;
    transform-origin: top center;
    z-index: 4;
  }

  .energy-stream::after {
    content: '';
    position: absolute;
    top: 0;
    left: -1px;
    width: 4px;
    height: 40px;
    border-radius: 4px;
    animation: streamFlow 2s linear infinite;
  }

  @keyframes streamFlow {
    0% { top: 0; opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { top: 260px; opacity: 0; }
  }

  .energy-stream:nth-child(1) { transform: rotate(0deg); }
  .energy-stream:nth-child(1)::after { background: #6464ff; box-shadow: 0 0 8px #6464ff; animation-delay: 0s; }
  .energy-stream:nth-child(2) { transform: rotate(45deg); }
  .energy-stream:nth-child(2)::after { background: #c864ff; box-shadow: 0 0 8px #c864ff; animation-delay: 0.25s; }
  .energy-stream:nth-child(3) { transform: rotate(90deg); }
  .energy-stream:nth-child(3)::after { background: #ff64c8; box-shadow: 0 0 8px #ff64c8; animation-delay: 0.5s; }
  .energy-stream:nth-child(4) { transform: rotate(135deg); }
  .energy-stream:nth-child(4)::after { background: #64c8ff; box-shadow: 0 0 8px #64c8ff; animation-delay: 0.75s; }
  .energy-stream:nth-child(5) { transform: rotate(180deg); }
  .energy-stream:nth-child(5)::after { background: #64ffaa; box-shadow: 0 0 8px #64ffaa; animation-delay: 1.0s; }
  .energy-stream:nth-child(6) { transform: rotate(225deg); }
  .energy-stream:nth-child(6)::after { background: #ffc864; box-shadow: 0 0 8px #ffc864; animation-delay: 1.25s; }
  .energy-stream:nth-child(7) { transform: rotate(270deg); }
  .energy-stream:nth-child(7)::after { background: #ff6464; box-shadow: 0 0 8px #ff6464; animation-delay: 1.5s; }
  .energy-stream:nth-child(8) { transform: rotate(315deg); }
  .energy-stream:nth-child(8)::after { background: #aa64ff; box-shadow: 0 0 8px #aa64ff; animation-delay: 1.75s; }

  /* ===== GRAVITATIONAL LENS (radial warp) ===== */
  .grav-lens {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 500px;
    height: 500px;
    margin-top: -250px;
    margin-left: -250px;
    border-radius: 50%;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(circle,
      rgba(100, 50, 255, 0.08) 0%,
      rgba(100, 50, 255, 0.04) 30%,
      transparent 50%
    );
    animation: lensBreath 4s ease-in-out infinite;
  }

  @keyframes lensBreath {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  /* ===== CONTENT OVERLAY ===== */
  .content-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .portal-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: -2px;
    text-align: center;
    margin-bottom: 8px;
    position: relative;
  }

  /* Chromatic aberration on title */
  .portal-title .layer {
    position: relative;
  }

  .portal-title .layer::before,
  .portal-title .layer::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    pointer-events: none;
  }

  .portal-title .layer::before {
    color: #ff0080;
    z-index: -1;
    animation: chromaR 4s ease-in-out infinite;
  }

  .portal-title .layer::after {
    color: #00ccff;
    z-index: -2;
    animation: chromaB 4s ease-in-out infinite;
  }

  @keyframes chromaR {
    0%, 100% { transform: translate(0, 0); opacity: 0.5; }
    25% { transform: translate(3px, -2px); opacity: 0.7; }
    50% { transform: translate(-2px, 3px); opacity: 0.5; }
    75% { transform: translate(2px, 1px); opacity: 0.7; }
  }

  @keyframes chromaB {
    0%, 100% { transform: translate(0, 0); opacity: 0.5; }
    25% { transform: translate(-3px, 2px); opacity: 0.7; }
    50% { transform: translate(2px, -3px); opacity: 0.5; }
    75% { transform: translate(-2px, -1px); opacity: 0.7; }
  }

  .portal-sub {
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(200, 150, 255, 0.5);
    margin-bottom: 40px;
    animation: subReveal 1.5s ease-out 0.5s both;
  }

  @keyframes subReveal {
    from { opacity: 0; transform: translateY(20px); letter-spacing: 15px; }
    to { opacity: 1; transform: translateY(0); letter-spacing: 6px; }
  }

  /* ===== DATA READOUT PANELS ===== */
  .readout-grid {
    display: grid;
    grid-template-columns: repeat(3, 200px);
    gap: 16px;
    pointer-events: auto;
  }

  .readout {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(150, 100, 255, 0.12);
    border-radius: 12px;
    padding: 20px 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: readoutIn 0.6s ease-out both;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .readout:nth-child(1) { animation-delay: 1.2s; }
  .readout:nth-child(2) { animation-delay: 1.4s; }
  .readout:nth-child(3) { animation-delay: 1.6s; }

  @keyframes readoutIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Animated top border */
  .readout::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: borderGlow 3s ease-in-out infinite;
  }

  .readout:nth-child(1) { --accent: #6464ff; }
  .readout:nth-child(2) { --accent: #c864ff; }
  .readout:nth-child(3) { --accent: #64c8ff; }

  @keyframes borderGlow {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .readout-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
    margin-bottom: 8px;
  }

  .readout-value {
    font-family: 'Unbounded', sans-serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .readout:nth-child(1) .readout-value { color: #8888ff; }
  .readout:nth-child(2) .readout-value { color: #dd88ff; }
  .readout:nth-child(3) .readout-value { color: #88ddff; }

  .readout-unit {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.25);
    letter-spacing: 1px;
  }

  /* Pulse ring inside readout */
  .readout-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    margin-top: -30px;
    margin-left: -30px;
    border-radius: 50%;
    border: 1px solid;
    border-color: var(--accent);
    opacity: 0;
    animation: readoutPulse 3s ease-out infinite;
  }

  @keyframes readoutPulse {
    0% { transform: scale(0.5); opacity: 0.5; }
    100% { transform: scale(3); opacity: 0; }
  }

  .readout:nth-child(2) .readout-ring { animation-delay: 1s; }
  .readout:nth-child(3) .readout-ring { animation-delay: 2s; }

  /* ===== WARP SPEED LINES ===== */
  .warp-lines {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  .warp-line {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 0;
    transform-origin: top center;
    animation: warpStretch 3s ease-in infinite;
  }

  @keyframes warpStretch {
    0% { height: 0; opacity: 0; }
    30% { opacity: 0.6; }
    100% { height: 500px; opacity: 0; }
  }

  .warp-line:nth-child(1) { transform: rotate(15deg); animation-delay: 0s; }
  .warp-line:nth-child(1)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(100,100,255,0.6), transparent); }
  .warp-line:nth-child(2) { transform: rotate(75deg); animation-delay: 0.4s; }
  .warp-line:nth-child(2)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(200,100,255,0.6), transparent); }
  .warp-line:nth-child(3) { transform: rotate(135deg); animation-delay: 0.8s; }
  .warp-line:nth-child(3)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(100,200,255,0.6), transparent); }
  .warp-line:nth-child(4) { transform: rotate(195deg); animation-delay: 1.2s; }
  .warp-line:nth-child(4)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,100,200,0.6), transparent); }
  .warp-line:nth-child(5) { transform: rotate(255deg); animation-delay: 1.6s; }
  .warp-line:nth-child(5)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(100,255,200,0.6), transparent); }
  .warp-line:nth-child(6) { transform: rotate(315deg); animation-delay: 2.0s; }
  .warp-line:nth-child(6)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,200,100,0.6), transparent); }
  .warp-line:nth-child(7) { transform: rotate(45deg); animation-delay: 0.2s; }
  .warp-line:nth-child(7)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(150,100,255,0.5), transparent); }
  .warp-line:nth-child(8) { transform: rotate(105deg); animation-delay: 0.6s; }
  .warp-line:nth-child(8)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,150,100,0.5), transparent); }
  .warp-line:nth-child(9) { transform: rotate(165deg); animation-delay: 1.0s; }
  .warp-line:nth-child(9)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(100,255,150,0.5), transparent); }
  .warp-line:nth-child(10) { transform: rotate(225deg); animation-delay: 1.4s; }
  .warp-line:nth-child(10)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,100,100,0.5), transparent); }
  .warp-line:nth-child(11) { transform: rotate(285deg); animation-delay: 1.8s; }
  .warp-line:nth-child(11)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(100,100,255,0.5), transparent); }
  .warp-line:nth-child(12) { transform: rotate(345deg); animation-delay: 2.2s; }
  .warp-line:nth-child(12)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(200,200,100,0.5), transparent); }

  /* ===== NEBULA CLOUDS ===== */
  .nebula {
    position: fixed;
    border-radius: 50%;
    z-index: 1;
    pointer-events: none;
    filter: blur(80px);
  }

  .nebula:nth-child(1) {
    width: 500px;
    height: 500px;
    top: -10%;
    right: -10%;
    background: rgba(100, 50, 255, 0.12);
    animation: nebulaFloat 12s ease-in-out infinite;
  }

  .nebula:nth-child(2) {
    width: 400px;
    height: 400px;
    bottom: -10%;
    left: -10%;
    background: rgba(255, 50, 150, 0.1);
    animation: nebulaFloat 15s ease-in-out infinite reverse;
  }

  .nebula:nth-child(3) {
    width: 300px;
    height: 300px;
    top: 30%;
    left: 60%;
    background: rgba(50, 200, 255, 0.08);
    animation: nebulaFloat 10s ease-in-out 2s infinite;
  }

  @keyframes nebulaFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.1); }
    66% { transform: translate(-30px, 20px) scale(0.95); }
  }

  /* ===== DEMO LABEL ===== */
  .demo-label {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(150, 100, 255, 0.15);
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 12px;
    color: rgba(200, 150, 255, 0.5);
    z-index: 100;
  }
</style>
</head>
<body>

<!-- Deep Space -->
<div class="space-bg"></div>
<div class="star-layer far"></div>
<div class="star-layer mid"></div>

<!-- Nebula Clouds -->
<div class="nebula"></div>
<div class="nebula"></div>
<div class="nebula"></div>

<!-- Warp Speed Lines -->
<div class="warp-lines">
  <div class="warp-line"></div><div class="warp-line"></div><div class="warp-line"></div>
  <div class="warp-line"></div><div class="warp-line"></div><div class="warp-line"></div>
  <div class="warp-line"></div><div class="warp-line"></div><div class="warp-line"></div>
  <div class="warp-line"></div><div class="warp-line"></div><div class="warp-line"></div>
</div>

<!-- Portal Zone -->
<div class="portal-zone">
  <!-- Gravitational Lens -->
  <div class="grav-lens"></div>

  <!-- Portal Rings -->
  <div class="portal-rings">
    <div class="ring"><div class="ring-node"></div><div class="ring-node"></div></div>
    <div class="ring"></div>
    <div class="ring"><div class="ring-node"></div></div>
    <div class="ring"></div>
    <div class="ring"><div class="ring-node"></div></div>
    <div class="ring"></div>
    <div class="ring"><div class="ring-node"></div></div>
  </div>

  <!-- Energy Streams -->
  <div class="energy-stream"></div><div class="energy-stream"></div>
  <div class="energy-stream"></div><div class="energy-stream"></div>
  <div class="energy-stream"></div><div class="energy-stream"></div>
  <div class="energy-stream"></div><div class="energy-stream"></div>

  <!-- Portal Core -->
  <div class="portal-core"></div>
</div>

<!-- Content -->
